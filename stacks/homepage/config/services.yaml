---
# For configuration options and examples, please see:
# https://gethomepage.dev/configs/services/
- Photos:
    - Immich:
        icon: immich.png
        href: http://hub.fritz.box:2283
        siteMonitor: http://immich_server:2283
        description: Photo & video library
        widget:
          type: immich
          url: http://immich_server:2283
          key: "{{HOMEPAGE_VAR_IMMICH_KEY}}"
          version: 2
          fields: ["photos", "videos", "storage"]
    - Immich Postgres:
        icon: postgres.png
        description: Metadata & search index DB
        widget:
          type: docker
          container: immich_postgres
    - Immich Machine Learning:
        icon: immich.png
        description: Face & object recognition
        widget:
          type: docker
          container: immich_machine_learning
    - Immich Redis:
        icon: redis.png
        description: Job queue cache
        widget:
          type: docker
          container: immich_redis

- Music:
    - Metube:
        icon: metube.png
        href: http://hub.fritz.box:8081
        siteMonitor: http://metube:8081
        description: yt-dlp download UI
        widget:
          type: docker
          container: metube

- Bookmarks:
    - Karakeep:
        icon: sh-karakeep
        href: http://hub.fritz.box:3030
        siteMonitor: http://karakeep-web-1:3000
        description: Bookmark manager
        widget:
          type: karakeep
          url: http://karakeep-web-1:3000
          key: "{{HOMEPAGE_VAR_KARAKEEP_KEY}}"
          fields: ["bookmarks", "favorites", "tags"]
    - Karakeep Meilisearch:
        icon: meilisearch.png
        description: Bookmark search index
        widget:
          type: docker
          container: karakeep-meilisearch-1
    - Karakeep Chrome:
        icon: sh-google-chrome
        description: Headless crawler
        widget:
          type: docker
          container: karakeep-chrome-1

- Documents:
    - Paperless-ngx:
        icon: paperless-ngx.png
        href: http://hub.fritz.box:8010
        siteMonitor: http://paperless-ngx-webserver-1:8000
        description: Document management
        widget:
          type: paperlessngx
          url: http://paperless-ngx-webserver-1:8000
          key: "{{HOMEPAGE_VAR_PAPERLESS_KEY}}"
          fields: ["total"]
    - Paperless DB:
        icon: postgres.png
        description: Document & OCR metadata
        widget:
          type: docker
          container: paperless-ngx-db-1
    - Paperless Broker:
        icon: redis.png
        description: Task queue
        widget:
          type: docker
          container: paperless-ngx-broker-1

- Utilities:
    - Homepage:
        icon: homepage.png
        href: http://hub.fritz.box:9595
        description: This dashboard
        widget:
          type: docker
          container: homepage
    - Finances:
        icon: mdi-cash-multiple
        href: https://hub.fritz.box:8787
        siteMonitor: http://finances-finances-1
        description: Personal finance tracker
        widget:
          type: docker
          container: finances-finances-1
    - Syncthing:
        icon: syncthing.png
        href: http://hub.fritz.box:8384
        siteMonitor: http://syncthing:8384
        description: File sync
        widget:
          type: customapi
          url: http://syncthing:8384/rest/svc/report
          headers:
            X-API-Key: "{{HOMEPAGE_VAR_SYNCTHING_KEY}}"
          mappings:
            - field: totMiB
              label: Stored
              format: number
              suffix: " MB"
            - field: numFolders
              label: Folders
              format: number
            - field: numFiles
              label: Files
              format: number
    - NPM:
        icon: sh-nginx-proxy-manager
        href: http://hub.fritz.box:81
        description: Reverse Proxy (NPM)
        siteMonitor: http://nginx-proxy-manager-app-1
        widget:
          type: npm
          url: http://nginx-proxy-manager-app-1:81
          username: "{{HOMEPAGE_VAR_NPM_ADMIN_USERNAME}}"
          password: "{{HOMEPAGE_VAR_NPM_ADMIN_PASSWORD}}"
    - Fritz:
        icon: sh-fritz
        href: http://fritz.box
        description: FRITZ!Box Informationen
        widget:
          type: fritzbox
          url: http://fritz.box
          fields: ["connectionStatus", "uptime", "received", "sent"]
