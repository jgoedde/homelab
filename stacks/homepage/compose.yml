services:
  homepage:
    image: ghcr.io/gethomepage/homepage:v2.1.2
    container_name: homepage
    ports:
      - "9595:3000"
    volumes:
      - ./config:/app/config
      - /var/run/docker.sock:/var/run/docker.sock:ro # (optional) For docker integrations
    environment:
      HOMEPAGE_ALLOWED_HOSTS: "*"
    env_file:
      - .env
    restart: unless-stopped
    networks:
      - default
      - immich_default
      - karakeep_default
      - paperless-ngx_default
      - syncthing_default
      - metube_default
      - npm-proxy

networks:
  default: { }
  immich_default:
    external: true
  karakeep_default:
    external: true
  paperless-ngx_default:
    external: true
  syncthing_default:
    external: true
  metube_default:
    external: true
  npm-proxy:
    external: true
