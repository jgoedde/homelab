services:
  metube:
    image: ghcr.io/alexta69/metube:2026.08.28
    container_name: metube
    restart: unless-stopped
    ports:
      - "8081:8081"
    volumes:
      - /home/julian/Music/inbox-metube:/downloads
      - ./yt-dlp-options.json:/app/yt-dlp-options.json
      - ./yt-dlp-presets.json:/app/yt-dlp-presets.json
    env_file:
      - .env
