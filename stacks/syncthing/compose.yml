services:
  syncthing:
    image: lscr.io/linuxserver/syncthing:latest
    container_name: syncthing
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Berlin
    volumes:
      - ./config:/config
      - /home/julian/Documents/portfolio-performance:/portfolio-performance
      - /home/julian/Obsidian:/obsidian
      - /home/julian/Music/library:/music-library
      - /home/julian/Documents/finanzen:/finanzen
    ports:
      - "127.0.0.1:8384:8384"
      - "22000:22000/tcp"
      - "22000:22000/udp"
      - "21027:21027/udp"
    restart: unless-stopped
