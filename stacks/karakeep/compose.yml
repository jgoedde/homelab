services:
  web:
    image: ghcr.io/karakeep-app/karakeep:0.34.1
    restart: unless-stopped
    volumes:
      # By default, the data is stored in a docker volume called "data".
      # If you want to mount a custom directory, change the volume mapping to:
      # - /path/to/your/directory:/data
      - /home/julian/Documents/karakeep-app:/data
      # Generated by cookie-sync: cookies.json (browser) + cookies.txt (yt-dlp)
      - cookies:/cookies
    ports:
      - "3030:3000"
    env_file:
      - .env
    environment:
      MEILI_ADDR: http://meilisearch:7700
      BROWSER_WEB_URL: http://chrome:9222
      DATA_DIR: /data # DON'T CHANGE THIS
      BROWSER_COOKIE_PATH: /cookies/cookies.json
    depends_on:
      cookie-sync:
        condition: service_healthy

  cookie-sync:
    image: alpine:3.24.4
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c", "apk add --no-cache jq docker-cli >/dev/null && exec /bin/sh /cookie-sync.sh"]
    volumes:
      # SSOT: all *.txt files in ./cookies are merged (mount the directory, not single files)
      - ./cookies:/src:ro
      - ./cookie-sync/cookie-sync.sh:/cookie-sync.sh:ro
      - cookies:/out
      - /var/run/docker.sock:/var/run/docker.sock # needed to restart "web"
    environment:
      TARGET_SERVICE: web
      POLL_INTERVAL: 10
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/ready"]
      interval: 5s
      retries: 60

  chrome:
    image: ghcr.io/karakeep-app/karakeep-chrome:release
    restart: unless-stopped
    init: true
    command:
      - --disable-gpu
      - --disable-dev-shm-usage
      - --hide-scrollbars
      - --disable-blink-features=AutomationControlled
      - --window-size=1440,900
  meilisearch:
    image: getmeili/meilisearch:v1.41.0
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - meilisearch:/meili_data

volumes:
  meilisearch:
  cookies: