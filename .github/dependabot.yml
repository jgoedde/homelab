version: 2

updates:
  - package-ecosystem: "docker-compose"
    directories:
      - "/stacks/*"
    exclude-paths:
      - "stacks/beets-stats/**"
    schedule:
      interval: "daily"
    commit-message:
      prefix: "chore"
    assignees:
      - "jgoedde"
    ignore:
      # Karakeep pins Meilisearch; major data-format changes need manual migration
      - dependency-name: "getmeili/meilisearch"
    groups:
      immich:
        patterns:
          - immich-app/immich-server
          - immich-app/immich-machine-learning
